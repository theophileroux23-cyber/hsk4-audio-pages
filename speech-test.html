<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech test</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; font-size: 18px; }
  button { font-size: 20px; padding: 16px 24px; }
  #out { margin-top: 20px; white-space: pre-wrap; word-break: break-word; }
  #diag { margin-top: 20px; color: #666; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<button id="go">Tap to speak (zh-CN)</button>
<div id="out">(nothing yet)</div>
<div id="diag"></div>
<script>
const out = document.getElementById('out');
const diag = document.getElementById('diag');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

diag.textContent =
  'standalone (home screen): ' + (window.navigator.standalone === true) + '\n' +
  'SpeechRecognition available: ' + !!SR + '\n' +
  'userAgent: ' + navigator.userAgent;

document.getElementById('go').addEventListener('click', () => {
  if (!SR) {
    out.textContent = 'SpeechRecognition API not available in this browser context.';
    return;
  }
  out.textContent = 'listening...';
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.continuous = false;

  rec.onresult = (e) => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) {
      text += e.results[i][0].transcript;
    }
    out.textContent = text + (e.results[e.results.length - 1].isFinal ? '  [final]' : '  [interim]');
  };
  rec.onerror = (e) => {
    out.textContent = 'ERROR: ' + e.error;
  };
  rec.onend = () => {
    diag.textContent += '\n(recognition ended)';
  };

  try {
    rec.start();
  } catch (err) {
    out.textContent = 'start() threw: ' + err;
  }
});
</script>
</body>
</html>
