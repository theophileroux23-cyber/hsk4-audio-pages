<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK4 quick test (3 items)</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; font-size: 18px; background: #111; color: #eee; }
  button { font-size: 22px; padding: 20px 28px; width: 100%; border-radius: 12px; border: none; background: #2a6; color: white; }
  #status { margin-top: 24px; font-size: 20px; text-align: center; min-height: 2em; }
  #error { margin-top: 20px; padding: 16px; background: #611; border-radius: 8px; display: none; white-space: pre-wrap; }
  #end-box { display: none; margin-top: 24px; }
  #grade-cmd { font-family: monospace; font-size: 16px; background: #222; padding: 16px; border-radius: 8px; word-break: break-all; }
  #log { margin-top: 20px; font-family: monospace; font-size: 13px; white-space: pre-wrap; color: #9c9; }
</style>
</head>
<body>
<p style="color:#aaa">3-item test — same code as the real page, just a short session so you don't have to go through all 40.</p>
<button id="go">Tap to start</button>
<div id="status"></div>
<div id="error"></div>
<div id="end-box">
  <p>Test complete.</p>
  <div id="grade-cmd"></div>
</div>
<div id="log"></div>

<script src="vendor/pinyin-pro.min.js"></script>
<script src="match.js"></script>
<script src="session-runner.js"></script>
<script>
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const logEl = document.getElementById('log');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  statusEl.textContent = '';
}

document.getElementById('go').addEventListener('click', async () => {
  document.getElementById('go').style.display = 'none';
  if (!SR) {
    showError('SpeechRecognition is not available in this browser/context.');
    return;
  }
  try {
    const { cmd } = await runSession('test-session.json', (s) => { statusEl.textContent = s; });
    statusEl.textContent = '';
    document.getElementById('grade-cmd').textContent = cmd;
    document.getElementById('end-box').style.display = 'block';
    logEl.textContent = window.__sessionLog
      .filter((e) => ['exercise_start', 'capture_result', 'graded'].includes(e.kind))
      .map((e) => e.kind + ' ' + JSON.stringify(e.detail))
      .join('\n');
  } catch (err) {
    showError('Stopped: ' + err.message);
  }
});
</script>
</body>
</html>
